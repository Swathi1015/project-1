<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Report - Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            color: white; padding-top: 30px; padding-bottom: 50px;
        }

        /* Restoring the background from previous pages */
        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://media.istockphoto.com/id/1058480580/photo/legacy-inheritance-or-death-tax-concept-us-dollar-bag-a-house-and-family-members-e-g-father.jpg?s=612x612&w=0&k=20&c=YO24Q8iUHMEVGiz-K1XJN1nPeObaV0ra0300TDzjz6w=');
            background-size: cover; background-position: center;
            filter: blur(8px); transform: scale(1.1); z-index: -2;
        }

        h1 { letter-spacing: 3px; text-transform: uppercase; color: #d2a679; margin-bottom: 20px; }

        /* Report Wrapper with Glassmorphism */
        .report-wrapper {
            width: 90%; max-width: 1000px;
            background: rgba(25, 18, 12, 0.85); 
            padding: 40px; border-radius: 20px; 
            border: 1px solid rgba(210, 166, 121, 0.3);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .summary-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
            margin-bottom: 40px;
        }

        .summary-box {
            background: rgba(210, 166, 121, 0.1);
            padding: 20px; border-radius: 12px;
            text-align: center; border: 1px solid rgba(210, 166, 121, 0.2);
        }

        .summary-box h3 { font-size: 0.75rem; color: #d2a679; margin: 0 0 10px 0; letter-spacing: 1px; }
        .summary-box p { font-size: 1.5rem; font-weight: 600; margin: 0; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; color: #ddd; }
        th { text-align: left; padding: 15px; border-bottom: 2px solid #d2a679; color: #d2a679; text-transform: uppercase; font-size: 0.8rem; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }

        .quote { text-align: center; font-style: italic; color: #aaa; margin-top: 40px; font-size: 0.9rem; }

        /* Buttons at the bottom */
        .action-area { display: flex; gap: 20px; margin-top: 10px; }
        .btn-main {
            background: #d2a679; color: #1a1009; border: none; 
            padding: 12px 35px; border-radius: 25px; cursor: pointer; 
            font-weight: bold; text-transform: uppercase; transition: 0.3s;
        }
        .btn-secondary {
            background: transparent; color: #d2a679; border: 1px solid #d2a679;
            padding: 12px 35px; border-radius: 25px; cursor: pointer;
            font-weight: bold; text-transform: uppercase;
        }
        .btn-main:hover { background: #b88d5f; transform: translateY(-2px); }

        @media (max-width: 768px) {
            .summary-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <h1>Financial Report</h1>

    <div class="report-wrapper" id="pdfContent">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px;">
           <div>
    <h2 id="userName" style="color: #d2a679; margin: 0;">Loading...</h2> 
    </div>
            <div style="text-align: right;">
                <p id="currentDate" style="margin: 0; color: #d2a679;"></p>
            </div>
        </div>

        <div class="summary-grid">
            <div class="summary-box">
                <h3>TOTAL BALANCE</h3>
                <p id="repTotalBalance">₹ 0</p>
            </div>
            <div class="summary-box">
                <h3>MONTHLY EXPENSES</h3>
                <p id="repTotalExpenses">₹ 0</p>
            </div>
            <div class="summary-box">
                <h3>SAVINGS & GOALS</h3>
                <p id="repTotalSavings">₹ 0</p>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Category</th>
                    <th>Reference</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>

        <p class="quote">"Financial freedom is available to those who learn about it and work for it." <br>— Robert Kiyosaki</p>
    </div>

    <div class="action-area">
        <button class="btn-secondary" onclick="window.location.href='dashboard1.html'">Back to Dashboard</button>
        <button class="btn-main" onclick="downloadPDF()">Download PDF Report</button>
    </div>

<script>

document.getElementById('currentDate').innerText =
    new Date().toLocaleDateString('en-IN', { dateStyle: 'long' });

async function loadReportData() {

    try {

        // 1️⃣ Fetch Expenses
        const expenseRes = await fetch("http://localhost:5000/api/expenses");
        const expenses = await expenseRes.json();

        // 2️⃣ Fetch Savings
        const savingRes = await fetch("http://localhost:5000/api/savings");
        const savings = await savingRes.json();

        // 3️⃣ Fetch Investments
        const investRes = await fetch("http://localhost:5000/api/investments");
        const investments = await investRes.json();

        // 4️⃣ Calculate Totals
        const totalExp = expenses.reduce((sum, item) =>
            sum + Number(item.amount || 0), 0);

        const totalSave = savings.reduce((sum, item) =>
            sum + Number(item.amount || 0), 0);

        const totalInv = investments.reduce((sum, item) =>
            sum + Number(item.amount || 0), 0);

        const totalSavingsAndInvestments = totalSave + totalInv;

        // 5️⃣ Update Summary Boxes
        document.getElementById('repTotalExpenses').innerText =
            "₹ " + totalExp.toLocaleString();

        document.getElementById('repTotalSavings').innerText =
            "₹ " + totalSavingsAndInvestments.toLocaleString();

        // If you want balance calculation:
        const netBalance = 0 - totalExp + totalSavingsAndInvestments;

        document.getElementById('repTotalBalance').innerText =
            "₹ " + netBalance.toLocaleString();

        // 6️⃣ Fill Table
        const body = document.getElementById('tableBody');
        body.innerHTML = "";

        // Expenses
        expenses.forEach(exp => {
            body.innerHTML += `
                <tr>
                    <td>${exp.category || "Expense"}</td>
                    <td>${exp.title || ""}</td>
                    <td>₹ ${Number(exp.amount || 0).toLocaleString()}</td>
                </tr>
            `;
        });

        // Savings
        savings.forEach(save => {
            body.innerHTML += `
                <tr>
                    <td>Savings</td>
                    <td>${save.title || ""}</td>
                    <td>₹ ${Number(save.amount || 0).toLocaleString()}</td>
                </tr>
            `;
        });

        // Investments
        investments.forEach(inv => {
            body.innerHTML += `
                <tr>
                    <td>Investment</td>
                    <td>${inv.title || ""}</td>
                    <td>₹ ${Number(inv.amount || 0).toLocaleString()}</td>
                </tr>
            `;
        });

    } catch (error) {
        console.log(error);
        alert("Error loading report data ❌");
    }
}

window.onload = loadReportData;

</script>
</body>
</html>
